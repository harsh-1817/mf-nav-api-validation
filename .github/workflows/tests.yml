
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly live check, Monday 03:00 UTC

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  live-api:
    if: github.event_name != 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_validation.py --out reports
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g newman newman-reporter-htmlextra
      - name: Run Newman tests
        continue-on-error: true
        run: >
          newman run postman/MFapi_Test_Suite.postman_collection.json
          -e postman/MFapi_Production.postman_environment.json
          -r cli,htmlextra
          --reporter-htmlextra-export reports/newman_report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: reports/
